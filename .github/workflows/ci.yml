name: Application CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate application
        working-directory: app
        run: npm test

      - name: Controlled long-running validation
        run: | 
          echo "Starting controlled timeout validation"
          sleep 150
          echo "Controlled validation completed"
